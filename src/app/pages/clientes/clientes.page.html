<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title>Clientes</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="contenedor">

    <h2>Clientes registrados</h2>

    <p class="descripcion">
      Información de nuestros clientes.
    </p>

    <ion-card *ngFor="let cliente of clientes">

      <ion-card-header>
        <ion-card-title>
          {{ cliente.nombre }}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <p>
          <strong>Teléfono:</strong>
          {{ cliente.telefono }}
        </p>

        <p>
          <strong>Correo:</strong>
          {{ cliente.correo }}
        </p>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
