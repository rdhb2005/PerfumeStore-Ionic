<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title>Clientes</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="contenedor">

    <h2>Clientes registrados</h2>

    <p class="descripcion">
      Administración de clientes persistentes en MySQL mediante la API PHP.
    </p>

    <ion-button expand="block" (click)="agregarCliente()">
      + Agregar cliente
    </ion-button>

    <ion-card *ngFor="let cliente of clientes">

      <ion-card-header>

        <ion-card-title>
          {{ cliente.nombre }}
        </ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <p>
          <strong>ID:</strong>
          {{ cliente.id }}
        </p>

        <p>
          <strong>Teléfono:</strong>
          {{ cliente.telefono }}
        </p>

        <p>
          <strong>Correo:</strong>
          {{ cliente.correo }}
        </p>

        <div class="acciones">

          <ion-button expand="block" (click)="editarCliente(cliente)">
            Editar
          </ion-button>

          <ion-button expand="block" color="danger" (click)="eliminarCliente(cliente)">
            Eliminar
          </ion-button>

        </div>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
