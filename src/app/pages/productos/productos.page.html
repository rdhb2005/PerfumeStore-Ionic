<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title>Perfumes</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="contenedor">

    <h2>Catálogo de perfumes</h2>

    <p class="descripcion">
      Administración de perfumes persistentes en MySQL mediante la API PHP.
    </p>

    <ion-button expand="block" (click)="agregarPerfume()">
      + Agregar perfume
    </ion-button>

    <ion-card *ngFor="let perfume of perfumes">

      <ion-card-header>

        <ion-card-title>
          {{ perfume.nombre }}
        </ion-card-title>

        <ion-card-subtitle>
          {{ perfume.marca }}
        </ion-card-subtitle>

      </ion-card-header>

      <ion-card-content>

        <p>
          <strong>ID:</strong>
          {{ perfume.id }}
        </p>

        <p>
          <strong>Tipo:</strong>
          {{ perfume.tipo }}
        </p>

        <p>
          <strong>Precio:</strong>
          ${{ perfume.precio }}
        </p>

        <p>
          <strong>Stock:</strong>
          {{ perfume.stock }}
        </p>

        <div class="acciones">

          <ion-button expand="block" (click)="editarPerfume(perfume)">
            Editar
          </ion-button>

          <ion-button expand="block" color="danger" (click)="eliminarPerfume(perfume)">
            Eliminar
          </ion-button>

        </div>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
